<body>
  <video autoplay muted loop playsinline id="bg-video">

</video>
      <header style="background-color: gray; padding: 15px; display: flex; align-items: center;">

  <center style="padding: 100px;">
 <fieldset style="width: 300px;">

      <datalist id="Country-list">

        <option value="Pakistan">
        <option value="Sri Lanka">
        <option value="Switzerland">
        <option value="Turkey">
        <option value="United Arab Emirates">
        <option value="United Kingdom">
        <option value="United States">
        <option value="Uzbekistan">
        <option value="Zimbabwe">
    </datalist>
   <br><br>
    <input type="text" name="add" id="add" placeholder="address" required>
    <br><br>
<div>
    <input type="text" id="contactMethod" name="contactMethod" list="Contact-method" placeholder="Preferred Contact Method" required>
    <datalist id="Contact-method">
        <option value="Email"></option>
        <option value="Phone Call"></option>
        <option value="SMS"></option>

    </datalist>
</div>
    <br><br>
